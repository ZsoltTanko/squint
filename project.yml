name: Squint
options:
  bundleIdPrefix: com.zsolttanko
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.2.0"
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: "2.4.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES

targets:
  Squint:
    type: application
    platform: macOS
    sources:
      - path: Squint
    info:
      path: Squint/App/Info.plist
      properties:
        LSUIElement: true
        CFBundleName: Squint
        CFBundleDisplayName: Squint
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSHumanReadableCopyright: ""
        NSAccessibilityUsageDescription: "Squint reads selected text from the focused app to send to your configured LLM."
        NSServices:
          - NSMenuItem:
              default: Ask Squint
            NSMessage: askSquint
            NSPortName: Squint
            NSSendTypes:
              - NSStringPboardType
              - public.utf8-plain-text
    entitlements:
      path: Squint/App/Squint.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zsolttanko.squint
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - package: KeyboardShortcuts
      - package: MarkdownUI
        product: MarkdownUI

  SquintTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SquintTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zsolttanko.squint.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Squint
